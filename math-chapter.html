<script>
const chapters=[{"title": "Applications of Matrices and Determinants", "volume": 1, "bookback": [["Find det([[2,3],[1,4]]).", "Δ=2×4−3×1=5."], ["Find the inverse of [[2,1],[1,1]].", "Δ=1 and adj(A)=[[1,−1],[−1,2]], so A⁻¹=[[1,−1],[−1,2]]."]], "important": [["Solve 2x+y=5 and x−y=1.", "Adding the equations gives 3x=6, so x=2; then y=1."], ["Find the adjoint of [[1,2],[3,4]].", "For [[a,b],[c,d]], adj(A)=[[d,−b],[−c,a]], so [[4,−2],[−3,1]]."]], "worked": [["Worked example: Find A⁻¹ for A=[[2,1],[1,1]].", "Δ=2−1=1. adj(A)=[[1,−1],[−1,2]], hence A⁻¹=[[1,−1],[−1,2]]."]], "formula": ["det([[a,b],[c,d]])=ad−bc.", "A⁻¹=adj(A)/det(A), when det(A)≠0.", "For AX=B, X=A⁻¹B, if A is invertible."]}, {"title": "Complex Numbers", "volume": 1, "bookback": [["If z=3+4i, find its conjugate and modulus.", "Conjugate=3−4i; modulus=√(9+16)=5."], ["Simplify (2+i)+(4−3i).", "(2+4)+(1−3)i=6−2i."]], "important": [["Find the square roots of −9.", "The square roots are ±3i."], ["Express 1+i in polar form.", "r=√2 and θ=π/4, so √2(cosπ/4+i sinπ/4)."]], "worked": [["Worked example: Write 1+i in polar form.", "r=√(1²+1²)=√2; its argument is π/4. Thus z=√2(cosπ/4+i sinπ/4)."]], "formula": ["For z=a+bi, |z|=√(a²+b²).", "Conjugate: z̄=a−bi; zz̄=|z|².", "De Moivre: [r(cosθ+i sinθ)]ⁿ=rⁿ(cos nθ+i sin nθ)."]}, {"title": "Theory of Equations", "volume": 1, "bookback": [["For x²−5x+6=0, find the sum and product of roots.", "For x²−5x+6=0, sum=5 and product=6."], ["Form a quadratic equation with roots 2 and −4.", "Sum=−2, product=−8; equation x²+2x−8=0."]], "important": [["Solve x³−6x²+11x−6=0.", "Roots are 1, 2 and 3, since (x−1)(x−2)(x−3)=0."], ["For ax²+bx+c=0, state the quadratic formula.", "x=(−b±√(b²−4ac))/(2a)."]], "worked": [["Worked example: Form a quadratic with roots 2 and −4.", "x²−(2−4)x+(2)(−4)=0, hence x²+2x−8=0."]], "formula": ["For ax²+bx+c=0: α+β=−b/a; αβ=c/a.", "x=(−b±√(b²−4ac))/(2a).", "For x³+ax²+bx+c=0, sum of roots=−a and product=−c."]}, {"title": "Inverse Trigonometric Functions", "volume": 1, "bookback": [["Evaluate sin⁻¹(1/2).", "π/6, because sin(π/6)=1/2 and it is in the principal range."], ["Evaluate tan⁻¹(1).", "π/4, because tan(π/4)=1."]], "important": [["Simplify sin⁻¹x+cos⁻¹x.", "The identity is π/2 for −1≤x≤1."], ["Evaluate cos⁻¹(−1/2).", "2π/3, because cos(2π/3)=−1/2 and 2π/3 is in [0,π]."]], "worked": [["Worked example: Evaluate cos⁻¹(−1/2).", "The principal range is [0,π]. Since cos(2π/3)=−1/2, the value is 2π/3."]], "formula": ["sin⁻¹x+cos⁻¹x=π/2, for −1≤x≤1.", "Range of sin⁻¹x: [−π/2,π/2].", "Range of cos⁻¹x: [0,π]."]}, {"title": "Two Dimensional Analytical Geometry – II", "volume": 1, "bookback": [["Find the centre and radius of x²+y²−4x+6y−12=0.", "(x−2)²+(y+3)²=25; centre (2,−3), radius 5."], ["Identify the conic y²=8x.", "It is a parabola opening right; 4a=8, so a=2."]], "important": [["Find the foci and eccentricity of x²/25+y²/9=1.", "c²=25−9=16, c=4; foci (±4,0), e=4/5."], ["Find the circle with centre (1,−2) and radius 3.", "(x−1)²+(y+2)²=9."]], "worked": [["Worked example: Find the circle with centre (1,−2) and radius 3.", "Use (x−h)²+(y−k)²=r². The equation is (x−1)²+(y+2)²=9."]], "formula": ["Circle: (x−h)²+(y−k)²=r².", "Parabola: y²=4ax or x²=4ay.", "Ellipse: c²=a²−b²; e=c/a. Hyperbola: c²=a²+b²; e=c/a."]}, {"title": "Applications of Vector Algebra", "volume": 1, "bookback": [["Find (2i+3j)·(i−4j).", "2×1+3×(−4)=−10."], ["Find the magnitude of 3i+4j+12k.", "Magnitude=√(9+16+144)=13."]], "important": [["Find the angle between i+j and i−j.", "Dot product is 1−1=0, so the vectors are perpendicular; angle=90°."], ["Find the area of the parallelogram formed by i and 2j.", "|i×2j|=|2k|=2 square units."]], "worked": [["Worked example: Find the angle between i+j and i−j.", "Their dot product is (1)(1)+(1)(−1)=0. Non-zero perpendicular vectors meet at 90°."]], "formula": ["a·b=|a||b|cosθ.", "|a×b|=|a||b|sinθ.", "Parallelogram area=|a×b|; triangle area=½|a×b|."]}, {"title": "Applications of Differential Calculus", "volume": 2, "bookback": [["Differentiate y=x³−4x²+2x.", "dy/dx=3x²−8x+2."], ["Find the stationary point of f(x)=x²−6x+5.", "f′=2x−6=0 gives x=3; f(3)=−4."]], "important": [["Find the local minimum of f(x)=x²−4x+1.", "f′=2x−4=0 gives x=2. Since f″=2>0, minimum value is −3."], ["Differentiate (2x+1)(x²−3).", "Product rule gives 2(x²−3)+(2x+1)(2x)=6x²+2x−6."]], "worked": [["Worked example: Differentiate y=(2x+1)(x²−3).", "Using the product rule, y′=2(x²−3)+(2x+1)(2x)=6x²+2x−6."]], "formula": ["d(xⁿ)/dx=nxⁿ⁻¹.", "(uv)′=u′v+uv′; (u/v)′=(u′v−uv′)/v².", "At a stationary point f′(x)=0; f″>0 indicates a local minimum and f″<0 a local maximum."]}, {"title": "Differentials and Partial Derivatives", "volume": 2, "bookback": [["If z=x²y+3y, find ∂z/∂x.", "Treat y as constant: ∂z/∂x=2xy."], ["If z=x²+xy+y², find ∂z/∂y.", "Treat x as constant: ∂z/∂y=x+2y."]], "important": [["Find the total differential of z=x²y+y².", "zx=2xy and zy=x²+2y; hence dz=2xy dx+(x²+2y)dy."], ["For f(x,y)=x²+3xy, find fx and fy.", "fx=2x+3y and fy=3x."]], "worked": [["Worked example: Find fx and fy for f(x,y)=x²+3xy.", "Differentiate with respect to x keeping y fixed: fx=2x+3y. With respect to y keeping x fixed: fy=3x."]], "formula": ["For z=f(x,y), fx=∂z/∂x and fy=∂z/∂y.", "Total differential: dz=fx dx+fy dy.", "When differentiating partially, treat the other variable as a constant."]}, {"title": "Applications of Integration", "volume": 2, "bookback": [["Evaluate ∫₀² 3x² dx.", "[x³]₀²=8."], ["Find the area under y=x from x=0 to x=3.", "∫₀³x dx=[x²/2]₀³=9/2 square units."]], "important": [["Evaluate ∫₀¹(2x+1)dx.", "[x²+x]₀¹=2."], ["Find ∫(4x³−2x)dx.", "x⁴−x²+C."]], "worked": [["Worked example: Evaluate ∫(4x³−2x)dx.", "Integrate term by term: 4(x⁴/4)−2(x²/2)+C=x⁴−x²+C."]], "formula": ["∫xⁿdx=xⁿ⁺¹/(n+1)+C, n≠−1.", "∫ₐᵇf(x)dx=F(b)−F(a), where F′=f.", "Area under a non-negative curve y=f(x) from a to b is ∫ₐᵇf(x)dx."]}, {"title": "Ordinary Differential Equations", "volume": 2, "bookback": [["Find the order and degree of (d²y/dx²)³+(dy/dx)²=0.", "Order=2; degree=3."], ["Solve dy/dx=3x².", "Integrating gives y=x³+C."]], "important": [["Solve dy/dx=2xy by separating variables.", "dy/y=2x dx; ln|y|=x²+C, so y=Ae^(x²)."], ["Solve dy/dx=4x³−2x.", "Integrating gives y=x⁴−x²+C."]], "worked": [["Worked example: Solve dy/dx=3x².", "Integrate both sides with respect to x: y=∫3x²dx=x³+C."]], "formula": ["Order is the highest derivative order present.", "Degree is the power of the highest-order derivative when polynomial in derivatives.", "If dy/dx=f(x), then y=∫f(x)dx+C."]}, {"title": "Probability Distributions", "volume": 2, "bookback": [["A fair coin is tossed once. Find the probability of a head.", "P(head)=1/2."], ["X takes values 0 and 1 with probabilities 0.4 and 0.6. Find E(X).", "E(X)=0(0.4)+1(0.6)=0.6."]], "important": [["For a binomial distribution n=4, p=1/2, find P(X=2).", "P(X=2)=⁴C₂(1/2)⁴=6/16=3/8."], ["Find the variance when X=0 and X=1 each have probability 1/2.", "Mean=0.5, E(X²)=0.5; variance=0.5−0.25=0.25."]], "worked": [["Worked example: Find E(X) for X=0,1 with probabilities 0.4,0.6.", "E(X)=ΣxP(x)=0(0.4)+1(0.6)=0.6."]], "formula": ["E(X)=ΣxP(X=x).", "Var(X)=E(X²)−[E(X)]².", "Binomial: P(X=r)=ⁿCᵣpʳ(1−p)ⁿ⁻ʳ; mean=np; variance=np(1−p)."]}, {"title": "Discrete Mathematics", "volume": 2, "bookback": [["Write the negation of 'It is raining'.", "The negation is: It is not raining."], ["If A={1,2,3} and B={3,4}, find A∩B.", "The only common element is 3, so A∩B={3}."]], "important": [["Give the truth values of p∧q for TT, TF, FT, FF.", "Truth values are T,F,F,F."], ["If A={a,b,c} and B={b,c,d}, find A∪B and A∩B.", "A∪B={a,b,c,d}; A∩B={b,c}."]], "worked": [["Worked example: If A={a,b,c} and B={b,c,d}, find union and intersection.", "Union contains all distinct elements: {a,b,c,d}. Intersection contains common elements: {b,c}."]], "formula": ["p∧q is true only when both p and q are true.", "p∨q is false only when both p and q are false.", "n(A∪B)=n(A)+n(B)−n(A∩B)."]}];
const sel=document.getElementById('chapterSelect'),panel=document.getElementById('panel'),content=document.getElementById('content');
let current=0,section='bookback';
chapters.forEach((c,i)=>{let o=document.createElement('option');o.value=i;o.textContent=`Chapter ${i+1} – ${c.title}`;sel.appendChild(o)});
function bookmarks(){try{return JSON.parse(localStorage.getItem('starLightMathBookmarks')||'[]')}catch(e){return []}}
function updateBookmark(){document.getElementById('bookmark').textContent=bookmarks().includes(current+1)?'★ Bookmarked':'☆ Bookmark Chapter'}
function chooseChapter(n){current=Number(n);let c=chapters[current];sel.value=current;document.getElementById('welcome').textContent=`Welcome to Chapter ${current+1}!`;document.getElementById('intro').textContent=`You are viewing Chapter ${current+1} from Mathematics Volume ${c.volume}. Explore the learning resources for this chapter.`;updateBookmark();if(!panel.hidden)showSection(section)}
function showSection(s){section=s;document.querySelectorAll('.card').forEach(b=>b.classList.toggle('active',b.dataset.section===s));panel.hidden=false;document.getElementById('panelTitle').textContent=({bookback:'📘 Book-back Practice',important:'⭐ Important Questions',worked:'✏️ Worked Examples',formula:'📐 Formula Sheet'})[s];document.getElementById('panelSub').textContent=`Chapter ${current+1}: ${chapters[current].title}`;content.replaceChildren();let items=chapters[current][s];
if(s==='bookback'){let p=document.createElement('p');p.className='note';p.textContent='These are original Star Light practice questions aligned with the chapter topics, not copied official textbook questions.';content.appendChild(p)}
if(s==='formula'){items.forEach(t=>{let d=document.createElement('div');d.className='formula';d.textContent=t;content.appendChild(d)})}
else{items.forEach((q,i)=>{let box=document.createElement('article');box.className='question';let m=document.createElement('div');m.className='meta';m.textContent=`Practice question ${i+1}`;let h=document.createElement('h3');h.textContent=q[0];let b=document.createElement('button');b.className='action';b.textContent='Show Answer & Explanation';b.setAttribute('aria-expanded','false');let a=document.createElement('div');a.className='answer';a.hidden=true;a.textContent=q[1];b.addEventListener('click',()=>{a.hidden=!a.hidden;b.textContent=a.hidden?'Show Answer & Explanation':'Hide Answer & Explanation';b.setAttribute('aria-expanded',String(!a.hidden))});box.append(m,h,b,a);content.appendChild(box)})}
panel.scrollIntoView({behavior:'smooth',block:'start'})}
document.querySelectorAll('.card').forEach(b=>b.addEventListener('click',()=>showSection(b.dataset.section)));
sel.addEventListener('change',e=>chooseChapter(e.target.value));
document.getElementById('bookmark').addEventListener('click',()=>{let a=bookmarks();a=a.includes(current+1)?a.filter(x=>x!==current+1):[...a,current+1];localStorage.setItem('starLightMathBookmarks',JSON.stringify(a));updateBookmark()});
let requested=Number(new URLSearchParams(location.search).get('chapter')||1);chooseChapter(Number.isInteger(requested)&&requested>=1&&requested<=12?requested-1:0);
</script></body></html>
